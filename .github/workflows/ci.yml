name: autograd-cpp CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PyTorch
      run: |
        python -m pip install --upgrade pip
        pip install torch numpy

    - name: Install System Dependencies (GCC & OpenMP)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libomp-dev

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DPython3_FIND_VIRTUALENV=ONLY

    - name: Compile Project
      run: cmake --build build --config Release -j $(nproc)

    - name: Run Core C++ Tensor Engine Tests
      run: ./build/tests/tensorgrad_tests

    - name: Run Neural Network Integration Tests
      run: ./build/tests/nn_tests

    - name: Run PyTorch Mathematical Cross-Verification
      run: |
        export PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/build
        python tests/pytorch-tests/autograd_verification.py
        python tests/pytorch-tests/linear_verification.py
        python tests/pytorch-tests/mlp_verification.py